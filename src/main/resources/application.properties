# Server Configuration
server.port=${PORT:8081}
spring.application.name=expense-tracker

# Railway MySQL Database (Cloud - 24/7)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://tramway.proxy.rlwy.net:14634/railway?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:FAuqyBgOVquUtJBPKbWBcPqgjkBNisLf}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
