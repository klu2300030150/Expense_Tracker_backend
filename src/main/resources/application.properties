# Server Configuration
server.port=${PORT:8081}
spring.application.name=expense-tracker

# MySQL Database (will use Railway MySQL add-on or environment variable)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/expense-tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Sreekar@8297}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnough123456789}
jwt.expiration=86400000

# CORS Configuration (allow your deployed frontend)
spring.web.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://*.vercel.app,https://*.netlify.app}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
